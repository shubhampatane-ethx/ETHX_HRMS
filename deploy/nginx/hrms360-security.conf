# HRMS 360 - security settings for the production nginx (fixes BUG-001, BUG-002, BUG-012 of the test report).
#
# How to use:
#   1. Copy this file to the server, e.g. /etc/nginx/snippets/hrms360-security.conf
#   2. In the server { } block that serves hr.ethxsoftcon.com, add:   include snippets/hrms360-security.conf;
#      (inside the HTTPS server block - and keep the HTTP block as a plain redirect to HTTPS)
#   3. Put the "location /" CSP line (below) into the location that serves the React app (dist/).
#   4. In /etc/nginx/nginx.conf, inside http { }, add:   server_tokens off;
#   5. sudo nginx -t && sudo systemctl reload nginx
#   6. Check:  curl -sI https://hr.ethxsoftcon.com/ | grep -iE "strict|content-security|x-frame|x-content|referrer|server"
#
# "always" makes nginx send the header on error pages too. Headers set in a location block REPLACE the server-level
# ones, so if a location has its own add_header lines, include this file in that location as well.

# --- BUG-002: don't advertise the nginx version (set server_tokens off in nginx.conf too) ---
server_tokens off;

# --- BUG-001: security headers on every response ---
# HTTPS only for a year, including sub-domains (only enable once every sub-domain serves HTTPS).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# No clickjacking: the app and ERPNext may only be framed by themselves (ERPNext's print preview uses same-site frames).
add_header X-Frame-Options "SAMEORIGIN" always;
# Browsers must not guess content types (stops uploaded files being run as scripts).
add_header X-Content-Type-Options "nosniff" always;
# Send only the origin to other sites, never full URLs (which can hold record IDs).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Features the app never uses.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;

# --- Content-Security-Policy for the React app ---
# Add this inside the location that serves dist/ (NOT the /api, /app, /desk proxy locations: ERPNext's own desk pages
# use inline scripts and would break). Repeat the lines above in that location too (see the note at the top).
#
#   add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
#
# 'unsafe-inline' for styles is needed because the app sets colours with inline style attributes; scripts stay strict.

# --- BUG-012: keep end users out of the raw ERPNext desk ---
# The React app doesn't need the desk: it reads its CSRF token from /me when /app is unavailable. Allow the desk only
# from your office / VPN addresses (replace the example address), so HR and employees can only use the app.
#
#   location ~ ^/(desk|app)(/|$) {
#       allow 203.0.113.10;      # office / VPN public IP
#       deny  all;
#       proxy_pass http://frappe-bench-frappe;   # same upstream as your existing / proxy
#       proxy_set_header Host $host;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }
#
# Then confirm with a low-privilege employee login that /desk and /app return 403 for them.
